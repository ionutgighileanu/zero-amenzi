<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ești offline — Zero Amenzi</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 24px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #003399;
        color: #ffffff;
        font-weight: 800;
        font-size: 14px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #475569;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">ZA</div>
      <h1>Ești offline</h1>
      <p>Datele afișate pot fi din cache.</p>
    </div>
  </body>
</html>
